<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | Velocity Motors</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            padding-top: 120px;
        }
        .info-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border-left: 5px solid var(--primary);
        }
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
        }
        .contact-form input:focus {
            border-color: var(--primary);
            outline: none;
        }
    </style>
</head>
<body>
    <header> <!-- Navbar same as before --> </header>

    <div class="container contact-container">
        <div class="contact-info" data-aos="fade-right">
            <h1>Let's Talk <span>Performance.</span></h1>
            <p>Our advisors are ready to help you find your next masterpiece.</p>
            <div class="info-box">
                <h3>Global Headquarters</h3>
                <p>101 Racing Blvd, Monaco</p>
                <p>Mon - Sat: 9:00 AM - 8:00 PM</p>
                <p><strong>Email:</strong> sales@velocity.com</p>
            </div>
        </div>

        <form class="contact-form" id="contactForm">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Email Address" required>
            <textarea rows="5" placeholder="Which car are you interested in?"></textarea>
            <button type="submit" class="btn-main" style="width:100%; padding: 15px; background: var(--primary); color:white; border:none; border-radius:8px; cursor:pointer;">Request Quote</button>
        </form>
    </div>
</body>
</html>
